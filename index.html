<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM Expenses</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#141a2e;--mut:#6b7491;--line:#e6e9f2;--ac:#4f46e5;--ac2:#8b5cf6;--ok:#059669;--bad:#e11d48;--okb:#d9f7ea;--badb:#ffe6ea;--sh:0 4px 18px rgba(30,40,90,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--card:#171b30;--tx:#eef0fa;--mut:#9aa1c0;--line:#272c48;--okb:#0b3b2e;--badb:#4a1424;--sh:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.ic{flex:none;vertical-align:middle}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 150px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:640px;margin:0 auto}
header h1{font-size:18px;margin:0;flex:1}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero small{opacity:.85}.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 4px 8px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m{color:var(--mut);font-size:13px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.ci{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);flex:none}
.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.amt{font-weight:700;text-align:right}.pos{color:var(--ok)}.neg{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--badb);color:var(--bad);font-weight:600}.pill.g{background:var(--okb);color:var(--ok)}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}.btn.w{width:100%}.btn.d{background:var(--badb);color:var(--bad)}.btn.s{padding:7px 11px;font-size:13px}
.ib{border:0;background:transparent;color:var(--mut);padding:6px;border-radius:10px;cursor:pointer}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:4px 0 10px;outline:0}
input:focus,select:focus{border-color:var(--ac)}label{font-size:12px;color:var(--mut);font-weight:600}
.pin{letter-spacing:.7em;text-align:center;font-size:24px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px}
nav button.on{color:var(--ac)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(82px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(79,70,229,.45);display:grid;place-items:center;z-index:19}
.ov{position:fixed;inset:0;background:rgba(5,8,20,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:100%;max-width:380px;padding:24px}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.thumb{width:62px;height:62px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.fl{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--tx);text-decoration:none;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#141a2e;color:#fff;padding:10px 16px;border-radius:99px;z-index:99;font-size:14px}
.banner{background:var(--badb);color:var(--bad);font-size:12px;padding:6px 10px;border-radius:10px;margin-bottom:10px}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
@media(max-width:380px){.big{font-size:26px}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><div class="login"><div class="m">Loading…</div></div></div>
<div id="ov"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',swap:'<path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 0 1 0 7M18.5 14.3c2.2.6 3.5 2.5 3.5 5.7"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',clip:'<path d="M20 11.5l-8.5 8.5a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 5 5l-8.5 8.5a1.7 1.7 0 0 1-2.5-2.5L14 8.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4h10.6L21 7H6"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',wifi:'<path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19.5h.01"/>',flame:'<path d="M12 22a7 7 0 0 0 7-7c0-4-3-6-4-10-3 2-5 5-5 8-1-1-2-2-2-4-2 2-3 4-3 6a7 7 0 0 0 7 7z"/>',wrench:'<path d="M14.5 6.5a4 4 0 0 0 5 5L21 13l-8 8-3-3 8-8M3 21l5-5"/>',building:'<path d="M4 21V4h10v17M14 9h6v12M8 8h2M8 12h2M8 16h2M3 21h18"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1"/>',file:'<path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/>',logout:'<path d="M9 21H4V3h5M16 17l5-5-5-5M21 12H9"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v10H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h.01"/>',down:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[n]||P.tag}</svg>`;
const CATICONS=['building','cart','bolt','drop','wifi','flame','wrench','tag'];
let S={users:[],cats:[],expenses:[],settlements:[],meta:[]},db=null,assets=null,dl=null,me=null,tab='home',month='all',ready=false,pending=[],got={},seeded=false;
try{me=sessionStorage.getItem('bro_me')}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cur=()=>(S.meta.find(m=>m.id=='settings')||{}).cur||'INR';
const fmt=n=>{try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:cur(),maximumFractionDigits:2}).format(n)}catch(e){return n.toFixed(2)}};
const U=id=>S.users.find(u=>u.id==id)||{name:'?'};
const COL=['#4f46e5','#0ea5e9','#f59e0b','#10b981','#e11d48','#8b5cf6'];
const av=id=>`<span class="av" style="background:${COL[Math.max(0,S.users.findIndex(u=>u.id==id))%6]}">${esc(U(id).name[0]||'?')}</span>`;
const dt=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)}
/* ---------- storage ---------- */
async function put(c,id,o){if(db){try{await db.collection(c).doc(id).set(o)}catch(e){toast('Save failed – check edit access')}}else{const r={...o,id},i=S[c].findIndex(x=>x.id==id);i<0?S[c].push(r):S[c][i]=r;try{localStorage.setItem('bro_'+c,JSON.stringify(S[c]))}catch(e){}render()}}
async function del(c,id){if(db){try{await db.collection(c).doc(id).delete()}catch(e){toast('Delete failed')}}else{S[c]=S[c].filter(x=>x.id!=id);try{localStorage.setItem('bro_'+c,JSON.stringify(S[c]))}catch(e){}render()}}
function seed(){if(seeded)return;seeded=true;
 if(!S.users.length)['Sabith','Sahad','Ismail'].forEach(n=>put('users',n.toLowerCase(),{name:n,pin:'1234'}));
 if(!S.cats.length)['Rent','Groceries','Electricity','Water','Internet','Gas','Repairs','Other'].forEach((n,i)=>put('cats',n.toLowerCase(),{name:n,icon:CATICONS[i]}))}
async function boot(){
 const c=window.claude;if(c){try{db=await c.use('db')}catch(e){}try{assets=await c.use('assets')}catch(e){}try{dl=await c.use('downloads')}catch(e){}}
 const local=why=>{db=null;why&&toast(why);Object.keys(S).forEach(c=>{try{S[c]=JSON.parse(localStorage.getItem('bro_'+c)||'[]')}catch(e){}});ready=true;seed();render()};
 if(db){let n=0;setTimeout(()=>{if(!ready)local('Shared data unavailable – using this device only')},6000);Object.keys(S).forEach(c=>db.collection(c).onSnapshot(sn=>{if(!db)return;S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));if(!got[c]){got[c]=1;n++}if(n==5){ready=true;seed()}if(ready)render()},e=>{if(!ready)local('Shared data error – using this device only')}))}
 else{Object.keys(S).forEach(c=>{try{S[c]=JSON.parse(localStorage.getItem('bro_'+c)||'[]')}catch(e){}});ready=true;seed();render()}
}
/* ---------- calc ---------- */
function calc(){const net={},paid={};S.users.forEach(u=>net[u.id]=paid[u.id]=0);
 S.expenses.forEach(e=>{const sp=(e.split||[]).filter(i=>i in net);if(!sp.length||!(e.paidBy in net))return;net[e.paidBy]+=e.amount;paid[e.paidBy]+=e.amount;sp.forEach(i=>net[i]-=e.amount/sp.length)});
 S.settlements.forEach(s=>{if(s.from in net)net[s.from]+=s.amount;if(s.to in net)net[s.to]-=s.amount});
 const dr=Object.entries(net).filter(x=>x[1]<-.005).map(x=>[x[0],-x[1]]).sort((a,b)=>b[1]-a[1]),cr=Object.entries(net).filter(x=>x[1]>.005).sort((a,b)=>b[1]-a[1]),debts=[];
 dr.forEach(d=>{while(d[1]>.005&&cr.length){const c=cr[0],a=Math.min(d[1],c[1]);debts.push({from:d[0],to:c[0],amt:a});d[1]-=a;c[1]-=a;if(c[1]<.005)cr.shift()}});
 return{net,paid,debts}}
/* ---------- views ---------- */
function render(){const a=$('#app');if(!ready)return;
 if(!me||!S.users.find(u=>u.id==me))return a.innerHTML=loginView();
 const v={home:homeView,exp:expView,settle:settleView,master:masterView}[tab]();
 a.innerHTML=`<header><span class="ci">${ic('wallet')}</span><h1>AM Expenses<div class="m" style="font-weight:500;font-size:12px">Aasiya Manzil</div></h1>${av(me)}</header><div class="wrap">${db?'':'<div class="banner">Local mode: data is saved on this device only.</div>'}${v}</div>
 <button class="fab" onclick="openAdd()" aria-label="Add expense">${ic('plus',26)}</button>
 <nav>${[['home','home','Home'],['exp','list','Expenses'],['settle','swap','Settle'],['master','users','Master']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)">${ic(t[1],22)}${t[2]}</button>`).join('')}</nav>`}
function loginView(){return`<div class="login"><div class="card"><div class="logo">${ic('home',32)}</div><h2 style="justify-content:center;margin:0 0 2px;font-size:22px;color:var(--tx);text-transform:none;letter-spacing:0">AM Expenses</h2><div class="m" style="text-align:center;margin-bottom:16px">Aasiya Manzil</div>
 <label>Who are you?</label><select id="lu">${S.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
 <label>4-digit PIN</label><input id="lp" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" oninput="this.value=this.value.replace(/\\D/g,'');if(this.value.length==4)doLogin()">
 <button class="btn p w" onclick="doLogin()">${ic('lock',18)} Sign in</button></div></div>`}
function doLogin(){const u=S.users.find(x=>x.id==$('#lu').value),p=$('#lp').value;if(u&&String(u.pin)===p){me=u.id;try{sessionStorage.setItem('bro_me',me)}catch(e){}tab='home';render()}else{toast('Wrong PIN');$('#lp').value=''}}
function logout(){me=null;try{sessionStorage.removeItem('bro_me')}catch(e){}render()}
function expRow(e){const c=S.cats.find(x=>x.id==e.cat)||{icon:'tag',name:'Other'},n=(e.split||[]).length;
 return`<div class="item row" onclick="openExp('${e.id}')"><span class="ci">${ic(c.icon)}</span><div class="grow"><div class="t">${esc(e.title)}</div><div class="m">${dt(e.date)} · ${esc(U(e.paidBy).name)} paid${(e.files||[]).length?' · '+ic('clip',13):''}</div></div><div><div class="amt">${fmt(e.amount)}</div><div class="m" style="text-align:right">${fmt(e.amount/Math.max(n,1))} each</div></div></div>`}
function debtRow(d,btn){return`<div class="item row">${av(d.from)}<div class="grow"><div class="t">${esc(U(d.from).name)} ${ic('arrow',14)} ${esc(U(d.to).name)}</div><div class="m">${esc(U(d.from).name)} owes ${esc(U(d.to).name)}</div></div><span class="amt neg">${fmt(d.amt)}</span>${btn?`<button class="btn s" onclick="openSettle('${d.from}','${d.to}',${d.amt.toFixed(2)})">Settle</button>`:''}</div>`}
function homeView(){const{net,paid,debts}=calc(),n=net[me]||0,tot=Object.values(paid).reduce((a,b)=>a+b,0),mx=Math.max(1,...Object.values(paid)),ym=today().slice(0,7),mt=S.expenses.filter(e=>e.date.startsWith(ym)).reduce((a,e)=>a+e.amount,0),rec=[...S.expenses].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,4);
 return`<div class="card hero"><small>Hi ${esc(U(me).name)}, your balance</small><div class="big">${Math.abs(n)<.005?'All settled':fmt(Math.abs(n))}</div><small>${n>.005?'You are owed by your brothers':n<-.005?'You owe your brothers':'Nothing outstanding'}</small></div>
 <div class="g2"><div class="card"><div class="m">This month</div><div class="t" style="font-size:18px">${fmt(mt)}</div></div><div class="card"><div class="m">All time</div><div class="t" style="font-size:18px">${fmt(tot)}</div></div></div>
 <h2>${ic('swap',14)} Outstanding</h2><div class="card">${debts.length?debts.map(d=>debtRow(d,1)).join(''):`<div class="m" style="text-align:center;padding:8px">Everyone is square ${ic('check',14)}</div>`}</div>
 <h2>${ic('wallet',14)} Paid so far</h2><div class="card">${S.users.map(u=>`<div class="item"><div class="row">${av(u.id)}<span class="grow t">${esc(u.name)}</span><span class="amt">${fmt(paid[u.id]||0)}</span></div><div class="bar"><i style="width:${(paid[u.id]||0)/mx*100}%"></i></div></div>`).join('')}</div>
 <h2>${ic('list',14)} Recent</h2><div class="card">${rec.map(expRow).join('')||'<div class="m" style="text-align:center">No expenses yet. Tap + to add.</div>'}</div>`}
function expView(){const ms=[...new Set(S.expenses.map(e=>e.date.slice(0,7)))].sort().reverse(),l=S.expenses.filter(e=>month=='all'||e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts),t=l.reduce((a,e)=>a+e.amount,0);
 return`<h2>${ic('list',14)} Expenses</h2><select onchange="month=this.value;render()"><option value="all">All months</option>${ms.map(m=>`<option value="${m}" ${m==month?'selected':''}>${new Date(m+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</option>`).join('')}</select>
 <div class="card"><div class="row"><span class="grow m">${l.length} expenses</span><b>${fmt(t)}</b></div></div><div class="card">${l.map(expRow).join('')||'<div class="m" style="text-align:center">Nothing here.</div>'}</div>`}
function settleView(){const{debts}=calc(),h=[...S.settlements].sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
 return`<h2>${ic('swap',14)} To settle</h2><div class="card">${debts.length?debts.map(d=>debtRow(d,1)).join(''):'<div class="m" style="text-align:center;padding:8px">All settled</div>'}</div>
 <h2>${ic('check',14)} Payments made</h2><div class="card">${h.map(s=>`<div class="item row">${av(s.from)}<div class="grow"><div class="t">${esc(U(s.from).name)} paid ${esc(U(s.to).name)}</div><div class="m">${dt(s.date)}</div></div><span class="amt pos">${fmt(s.amount)}</span><button class="ib" onclick="ask('Delete this payment?',()=>del('settlements','${s.id}'))">${ic('trash',18)}</button></div>`).join('')||'<div class="m" style="text-align:center">No payments yet.</div>'}</div>`}
function masterView(){const used=id=>S.expenses.some(e=>e.paidBy==id||(e.split||[]).includes(id))||S.settlements.some(s=>s.from==id||s.to==id);
 return`<h2>${ic('users',14)} Brothers</h2><div class="card">${S.users.map(u=>`<div class="item row">${av(u.id)}<span class="grow t">${esc(u.name)}${u.id==me?' <span class="m">(you)</span>':''}</span>${used(u.id)||u.id==me?'':`<button class="ib" onclick="ask('Remove ${esc(u.name)}?',()=>del('users','${u.id}'))">${ic('trash',18)}</button>`}</div>`).join('')}
 <div class="g2" style="margin-top:10px"><div><label>Name</label><input id="nn" placeholder="New member"></div><div><label>PIN</label><input id="np" inputmode="numeric" maxlength="4" placeholder="4 digits"></div></div><button class="btn w" onclick="addUser()">${ic('plus',18)} Add user</button></div>
 <h2>${ic('key',14)} My PIN</h2><div class="card"><label>Current PIN</label><input id="op" type="password" inputmode="numeric" maxlength="4"><div class="g2"><div><label>New PIN</label><input id="p1" type="password" inputmode="numeric" maxlength="4"></div><div><label>Confirm</label><input id="p2" type="password" inputmode="numeric" maxlength="4"></div></div><button class="btn w" onclick="chPin()">${ic('lock',18)} Change PIN</button></div>
 <h2>${ic('tag',14)} Categories</h2><div class="card">${S.cats.map(c=>`<div class="item row"><span class="ci">${ic(c.icon)}</span><span class="grow t">${esc(c.name)}</span>${S.expenses.some(e=>e.cat==c.id)?'':`<button class="ib" onclick="ask('Delete ${esc(c.name)}?',()=>del('cats','${c.id}'))">${ic('trash',18)}</button>`}</div>`).join('')}
 <label style="display:block;margin-top:10px">New category</label><input id="cn" placeholder="e.g. Medical"><div class="chips" id="ci">${CATICONS.map((i,k)=>`<span class="chip ${k==7?'on':''}" data-i="${i}" onclick="document.querySelectorAll('#ci .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${ic(i,18)}</span>`).join('')}</div><button class="btn w" onclick="addCat()">${ic('plus',18)} Add category</button></div>
 <h2>${ic('cog',14)} Settings</h2><div class="card"><label>Currency</label><select onchange="put('meta','settings',{cur:this.value})">${['INR','USD','AED','SAR','EUR','GBP','QAR','KWD'].map(c=>`<option ${c==cur()?'selected':''}>${c}</option>`).join('')}</select>
 <div class="g2"><button class="btn" onclick="exportCsv()">${ic('down',18)} Export CSV</button><button class="btn d" onclick="logout()">${ic('logout',18)} Log out</button></div></div>`}
/* ---------- actions ---------- */
const pinOk=p=>/^\d{4}$/.test(p);
function addUser(){const n=$('#nn').value.trim(),p=$('#np').value;if(!n)return toast('Enter a name');if(!pinOk(p))return toast('PIN must be 4 digits');if(S.users.some(u=>u.name.toLowerCase()==n.toLowerCase()))return toast('Name already exists');put('users',uid(),{name:n,pin:p});toast('User added')}
function chPin(){const u=U(me);if(String($('#op').value)!==String(u.pin))return toast('Current PIN is wrong');const a=$('#p1').value;if(!pinOk(a))return toast('New PIN must be 4 digits');if(a!==$('#p2').value)return toast('PINs do not match');put('users',me,{name:u.name,pin:a});toast('PIN changed')}
function addCat(){const n=$('#cn').value.trim();if(!n)return toast('Enter a name');put('cats',uid(),{name:n,icon:document.querySelector('#ci .on').dataset.i})}
async function exportCsv(){const r=[['Date','Title','Category','Amount','Paid by','Shared by','Note']].concat(S.expenses.map(e=>[e.date,e.title,(S.cats.find(c=>c.id==e.cat)||{}).name,e.amount,U(e.paidBy).name,(e.split||[]).map(i=>U(i).name).join('/'),e.note||'']));
 const csv=r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 try{if(dl)await dl.save({filename:'expenses.csv',data:new Blob([csv],{type:'text/csv'})});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='expenses.csv';a.click()}}catch(e){toast('Export cancelled')}}
function sheet(h){$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)closeSheet()"><div class="sheet">${h}</div></div>`}
function closeSheet(){$('#ov').innerHTML='';pending=[]}
function ask(m,f){window._cb=f;sheet(`<h3>${esc(m)}</h3><div class="g2"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn d" onclick="closeSheet();_cb()">Confirm</button></div>`)}
function openSettle(f,t,a){sheet(`<h3>Record payment <button class="ib" onclick="closeSheet()">${ic('x')}</button></h3><div class="row" style="margin-bottom:10px">${av(f)}${ic('arrow',16)}${av(t)}<span class="m grow">${esc(U(f).name)} pays ${esc(U(t).name)}</span></div><label>Amount</label><input id="sa" type="number" inputmode="decimal" value="${a}"><label>Date</label><input id="sd" type="date" value="${today()}"><button class="btn p w" onclick="saveSettle('${f}','${t}')">${ic('check',18)} Mark as paid</button>`)}
function saveSettle(f,t){const a=parseFloat($('#sa').value);if(!(a>0))return toast('Enter amount');put('settlements',uid(),{from:f,to:t,amount:Math.round(a*100)/100,date:$('#sd').value||today(),ts:Date.now(),by:me});closeSheet()}
function openAdd(){pending=[];sheet(`<h3>Add expense <button class="ib" onclick="closeSheet()">${ic('x')}</button></h3>
 <label>Title (optional)</label><input id="et" placeholder="${esc((S.cats[0]||{}).name||'')}"><div class="g2"><div><label>Amount (${cur()})</label><input id="ea" type="number" inputmode="decimal" placeholder="0.00"></div><div><label>Date</label><input id="ed" type="date" value="${today()}"></div></div>
 <label>Category</label><div class="chips" id="ec">${S.cats.map((c,i)=>`<span class="chip ${i==0?'on':''}" data-id="${c.id}" onclick="document.querySelectorAll('#ec .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on');$('#et').placeholder=this.textContent">${ic(c.icon,16)}${esc(c.name)}</span>`).join('')}</div>
 <label>Paid by</label><select id="eb">${S.users.map(u=>`<option value="${u.id}" ${u.id==me?'selected':''}>${esc(u.name)}</option>`).join('')}</select>
 <label>Split equally between</label><div class="chips" id="es">${S.users.map(u=>`<span class="chip on" data-id="${u.id}" onclick="this.classList.toggle('on')">${ic('user',16)}${esc(u.name)}</span>`).join('')}</div>
 <label>Note (optional)</label><input id="en"><label>Proof / documents</label><div class="files" id="ef"></div>
 <label class="btn w" style="cursor:pointer;margin-bottom:12px">${ic('clip',18)} Attach files<input type="file" multiple accept="image/*,.pdf,.doc,.docx" hidden onchange="onFiles(this)"></label>
 <button class="btn p w" onclick="saveExp()">${ic('check',18)} Save expense</button>`)}
function fileHtml(f){return/^image/.test(f.type)?`<a href="${esc(f.url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(f.url)}" alt=""></a>`:`<a class="fl" href="${esc(f.url)}" target="_blank" rel="noopener">${ic('file',16)}${esc(f.name)}</a>`}
async function onFiles(i){for(const f of i.files){try{let u,id='';if(assets){const r=await assets.upload(f);u=r.url;id=r.id}else{if(f.size>8e5){toast('File too large for local mode');continue}u=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
 pending.push({id,url:u,name:f.name,type:f.type})}catch(e){toast('Upload failed: '+f.name)}}$('#ef').innerHTML=pending.map(fileHtml).join('')}
function saveExp(){const t0=$('#et').value.trim(),a=parseFloat($('#ea').value),sp=[...document.querySelectorAll('#es .on')].map(x=>x.dataset.id),c=document.querySelector('#ec .on'),t=t0||(c?c.textContent.trim():'Expense');
 if(!(a>0))return toast('Enter a valid amount');if(!sp.length)return toast('Select who shares');
 put('expenses',uid(),{title:t,amount:Math.round(a*100)/100,date:$('#ed').value||today(),cat:c?c.dataset.id:'',paidBy:$('#eb').value,split:sp,note:$('#en').value.trim(),files:pending,by:me,ts:Date.now()});pending=[];closeSheet();toast('Expense added')}
function openExp(id){const e=S.expenses.find(x=>x.id==id);if(!e)return;const c=S.cats.find(x=>x.id==e.cat)||{icon:'tag',name:'Other'},sp=e.split||[],sh=e.amount/Math.max(sp.length,1);
 sheet(`<h3><span class="row"><span class="ci">${ic(c.icon)}</span>${esc(e.title)}</span><button class="ib" onclick="closeSheet()">${ic('x')}</button></h3>
 <div class="big" style="margin-bottom:4px">${fmt(e.amount)}</div><div class="m">${esc(c.name)} · ${dt(e.date)} · added by ${esc(U(e.by).name)}</div>${e.note?`<p>${esc(e.note)}</p>`:''}
 <h2>Split</h2>${sp.map(i=>`<div class="item row">${av(i)}<span class="grow t">${esc(U(i).name)}</span>${i==e.paidBy?'<span class="pill g">Paid</span>':`<span class="pill">Owes ${fmt(sh)}</span>`}</div>`).join('')}
 ${(e.files||[]).length?`<h2>${ic('clip',14)} Documents</h2><div class="files">${e.files.map(fileHtml).join('')}</div>`:''}
 <button class="btn d w" style="margin-top:14px" onclick="ask('Delete this expense?',()=>del('expenses','${e.id}'))">${ic('trash',18)} Delete expense</button>`)}
boot();
</script></body></html>
